[project]
name = "manaai-api"
version = "0.1.0"
description = "Production-ready FastAPI backend for AI integrations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.2",
    "starlette==1.3.1",
    "httpx==0.28.1",
    "uvicorn[standard]==0.35.0",
    "pydantic-settings==2.10.1",
    "openai==2.53.0",
]

[project.optional-dependencies]
operation = [
    "SQLAlchemy[asyncio]==2.0.41",
    "aiosqlite==0.21.0",
    "asyncpg==0.31.0",
    "alembic==1.16.2",
    "croniter==6.0.0",
    "google-auth[requests]==2.57.1",
]
dev = [
    "mypy==1.20.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.12.4",
    "types-croniter==6.0.0.20250809",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live_meta: bounded opt-in tests against the configured Meta account; never run by default",
    "live_product_activity: bounded opt-in read-only tests against Manakids and Firebase",
]

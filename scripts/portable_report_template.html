<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <title>@@TITLE@@</title>
    <style>
      :root {
        color: #14201b;
        background: #edf2ed;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-width: 320px;
        margin: 0;
        overflow-x: hidden;
      }
      header,
      main {
        width: min(1160px, 100%);
        margin: auto;
      }
      header {
        padding: 52px 28px 30px;
      }
      header span {
        color: #17643f;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 10px 0;
        font-size: clamp(32px, 6vw, 62px);
        letter-spacing: -0.05em;
      }
      h2 {
        margin: 0 0 12px;
      }
      h3 {
        overflow-wrap: anywhere;
      }
      p {
        color: #5d6c65;
        line-height: 1.6;
      }
      main {
        padding: 0 28px 70px;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 20px;
      }
      .pill {
        padding: 7px 11px;
        border-radius: 999px;
        background: #dff5e7;
        font-size: 12px;
        font-weight: 700;
      }
      section,
      .source-card {
        min-width: 0;
        margin: 0 0 18px;
        padding: 24px;
        border: 1px solid #d6dfd8;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 12px 32px rgb(20 32 27 / 5%);
      }
      .copy:first-child {
        display: none;
      }
      .chart > p {
        margin-top: -5px;
      }
      .bar-row {
        display: grid;
        grid-template-columns: minmax(90px, 160px) minmax(0, 1fr) 60px;
        gap: 12px;
        align-items: center;
        margin: 13px 0;
        font-size: 12px;
      }
      .bar-track {
        height: 13px;
        overflow: hidden;
        border-radius: 999px;
        background: #e8eeea;
      }
      .bar-track i {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: #17643f;
      }
      .dataset h3 {
        margin-top: 0;
        text-transform: capitalize;
      }
      .table-wrap {
        max-width: 100%;
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 10px 12px;
        border-bottom: 1px solid #e3e9e4;
        overflow-wrap: anywhere;
        font-size: 11px;
        text-align: left;
      }
      th {
        color: #65736d;
        background: #f5f8f5;
        text-transform: uppercase;
      }
      .empty {
        font-style: italic;
      }
      #source-toggle {
        margin: 4px 0 18px;
        padding: 10px 14px;
        border: 0;
        border-radius: 9px;
        color: white;
        background: #17643f;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      #sources[hidden] {
        display: none;
      }
      pre {
        max-width: 100%;
        overflow: auto;
        padding: 14px;
        border-radius: 10px;
        color: #dbe9e1;
        background: #14201b;
        font-size: 10px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      @media (max-width: 600px) {
        header {
          padding: 34px 16px 22px;
        }
        main {
          padding: 0 16px 50px;
        }
        section,
        .source-card {
          padding: 18px;
        }
        .bar-row {
          grid-template-columns: minmax(72px, 1fr) 2fr 50px;
          gap: 8px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span>Sanitized operational evidence</span>
      <h1>@@TITLE@@</h1>
      <p>@@DESCRIPTION@@</p>
      <div class="meta">
        <span class="pill">Status: @@STATUS@@</span>
        <span class="pill">Generated: @@GENERATED_AT@@</span>
      </div>
    </header>
    <main>
      @@BLOCKS@@
      <section>
        <h2>Normalized evidence datasets</h2>
        <p>Every unavailable value remains explicit; no value is inferred.</p>
      </section>
      @@DATASETS@@
      <button
        id="source-toggle"
        type="button"
        aria-controls="sources"
        aria-expanded="false"
      >
        Review evidence source
      </button>
      <section id="sources" hidden>
        <h2>Evidence provenance</h2>
        @@SOURCES@@
      </section>
    </main>
    <script>
      const toggle = document.getElementById("source-toggle");
      const sources = document.getElementById("sources");
      toggle.addEventListener("click", () => {
        const expanded = toggle.getAttribute("aria-expanded") === "true";
        toggle.setAttribute("aria-expanded", String(!expanded));
        sources.hidden = expanded;
      });
    </script>
  </body>
</html>

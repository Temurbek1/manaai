# Cloudflare-proxied production admin origin. Keep Cloudflare Full (strict) enabled.
server {
    listen 80;
    listen [::]:80;
    server_name ai-frontend.360rec.uz;
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai-frontend.360rec.uz;
    server_tokens off;

    ssl_certificate /etc/nginx/ssl/360rec-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/360rec-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Include only inside the ai.360rec.uz TLS server, after a verified export from
# its exact running product API image. No application factory/lifespan is run.
location = /docs {
    alias /var/www/mana-ai-docs/current/index.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    limit_except GET { deny all; }
}

location = /docs/ {
    return 302 /docs;
}

location = /openapi.json {
    alias /var/www/mana-ai-docs/current/openapi.json;
    default_type application/json;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}

location = /docs-assets/swagger-ui-bundle.js {
    alias /var/www/mana-ai-docs/current/swagger-ui-bundle.js;
    default_type application/javascript;
    charset utf-8;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}

location = /docs-assets/swagger-ui.css {
    alias /var/www/mana-ai-docs/current/swagger-ui.css;
    default_type text/css;
    charset utf-8;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}

location /docs-assets/ {
    return 404;
}
